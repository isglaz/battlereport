# Оверлей для прода: образы берутся из registry, а не собираются на сервере.
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# REGISTRY и TAG приходят из .env на сервере, который заполняет TeamCity.

services:
  postgres:
    restart: unless-stopped

  server:
    image: ${REGISTRY}/battlereport-server:${TAG}
    # Сбрасываем build из базового файла: на проде из исходников не собираем.
    build: !reset null
    restart: unless-stopped

  site:
    image: ${REGISTRY}/battlereport-site:${TAG}
    build: !reset null
    restart: unless-stopped
