# Production overlay: images are pulled from the registry instead of being built on the server.
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# REGISTRY and TAG come from the .env on the server, which TeamCity fills in.

services:
  postgres:
    restart: unless-stopped

  server:
    image: ${REGISTRY}/battlereport-server:${TAG}
    # Reset build from the base file: in production we do not build from sources.
    build: !reset null
    restart: unless-stopped

  site:
    image: ${REGISTRY}/battlereport-site:${TAG}
    build: !reset null
    restart: unless-stopped
