# Local environment: database, backend and frontend with a single `docker compose up`.
#
# Migrations are deliberately left out - they are a separate, deliberate deployment step,
# and the server does not apply them: `./deploy/migrate.sh update`.
#
# Production uses this same file with the compose.prod.yaml overlay, where images from the
# registry are substituted instead of building from sources.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The server starts only once the database is actually ready to accept connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 8080
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  site:
    build:
      context: .
      dockerfile: site/Dockerfile
    ports:
      - "${SITE_PORT:-8081}:80"
    depends_on:
      - server

volumes:
  pgdata:
