ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [
      org.isglaz.battlereport.HttpKt.configureHttp
      org.isglaz.battlereport.SerializationKt.configureSerialization
      org.isglaz.battlereport.DatabaseKt.configureDatabase
      org.isglaz.battlereport.StatusPagesKt.configureStatusPages
      org.isglaz.battlereport.ResourcesKt.configureResources
      org.isglaz.battlereport.RequestValidationKt.configureRequestValidation
      org.isglaz.battlereport.RoutingKt.configureRouting
    ]
  }
}

db {
  url = "r2dbc:postgresql://localhost:5432/battlereport"
  url = ${?DB_URL}
  user = "battlereport"
  user = ${?DB_USER}
  password = "battlereport"
  password = ${?DB_PASSWORD}
}
