# Master changelog. The migrations directory is self-contained: no build, no classpath -
# Liquibase reads the files from disk, so the paths are relative to this file.
#
# One folder per schema version. A new file inside a folder is picked up automatically; the
# apply order is lexicographic, so the NN- prefix in the name is mandatory.
databaseChangeLog:
  - includeAll:
      path: v-1.0.0
      relativeToChangelogFile: true
