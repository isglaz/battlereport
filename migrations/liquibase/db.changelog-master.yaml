# Мастер-changelog. Каталог с миграциями самодостаточен: никакой сборки, никакого
# classpath — Liquibase читает файлы с диска, поэтому пути относительны этому файлу.
#
# Одна папка на версию схемы. Новый файл внутри папки подхватывается сам,
# порядок применения — лексикографический, поэтому префикс NN- в имени обязателен.
databaseChangeLog:
  - includeAll:
      path: v-1.0.0
      relativeToChangelogFile: true
