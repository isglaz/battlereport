# The layout produced by kobwebExport: pages in pages/, the bundle in system/,
# static assets in resources/. All three directories are served from one root.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location /system/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /resources/ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Client-side routing: an unknown path is served as a page, otherwise index.html,
    # and Kobweb resolves the route in the browser from there.
    location / {
        try_files /pages$uri /pages$uri.html /pages$uri/index.html $uri /pages/index.html;
    }
}
