# Раскладка, которую делает kobwebExport: страницы в pages/, бандл в system/,
# статика в resources/. Отдаём всё три каталога с одного корня.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location /system/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /resources/ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Клиентский роутинг: неизвестный путь отдаём как страницу, иначе index.html,
    # дальше маршрут разбирает уже Kobweb в браузере.
    location / {
        try_files /pages$uri /pages$uri.html /pages$uri/index.html $uri /pages/index.html;
    }
}
